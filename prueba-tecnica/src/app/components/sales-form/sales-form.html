<div class="sales-container">

  <div class="sales-header">
    <div>
      <h2>Ventas y Consultas</h2>
      <p>Registra una nueva venta y consulta transacciones</p>
    </div>

    <span class="role-badge">
      Rol: Operador
    </span>
  </div>

  <div class="sales-card">

    <h3>Registrar Venta</h3>

    <form (ngSubmit)="registerSale()">

      <div class="form-grid">

        <div class="form-group">
          <label for="name">
            Nombre de la persona
          </label>

          <input
            id="name"
            type="text"
            name="name"
            placeholder="Nombre completo"
            [(ngModel)]="sale.name"
            required
          />
        </div>

        <div class="form-group">
          <label for="amount">
            Importe
          </label>

          <input
            id="amount"
            type="number"
            name="amount"
            placeholder="$ 0.00"
            min="1"
            step="0.01"
            [(ngModel)]="sale.amount"
            required
          />
        </div>

        <div class="form-group">
          <label for="card">
            Número de tarjeta
          </label>

          <input
            id="card"
            type="text"
            name="card"
            placeholder="1234 5678 9012 3456"
            maxlength="16"
            inputmode="numeric"
            [(ngModel)]="sale.card"
            required
          />
        </div>

        <div class="form-group">
          <label for="expiration">
            Fecha de expiración
          </label>

          <input
            id="expiration"
            type="text"
            name="expiration"
            placeholder="MM/AA"
            maxlength="5"
            [(ngModel)]="sale.expiration"
            required
          />
        </div>

        <div class="form-group">
          <label for="cvv">
            CVV
          </label>

          <input
            id="cvv"
            type="password"
            name="cvv"
            placeholder="123"
            maxlength="3"
            inputmode="numeric"
            [(ngModel)]="sale.cvv"
            required
          />
        </div>

        <div class="form-group">
          <label>
            Tipo de operación
          </label>

          <input
            type="text"
            value="Venta"
            readonly
          />
        </div>

        <div class="form-group">
          <label>
            Fecha
          </label>

          <input
            type="text"
            value="Automática"
            readonly
          />
        </div>

        <div class="button-container">
          <button
            type="submit"
            class="register-button"
          >
            Registrar Venta
          </button>
        </div>

      </div>

    </form>

  </div>

</div>
