<div class="container-fluid login-container">

  <div class="row h-100">
    <div class="col-12 col-md-4">
    </div>

    <div
      class="col-12 col-md-4 d-flex align-items-center justify-content-center"
    >

      <div class="login-card w-100">

        <div class="text-center mb-4">

          <h1 class="login-title">
            Bienvenido
          </h1>

          <p class="login-subtitle">
            Sistema de Transacciones
          </p>

        </div>

        <form (ngSubmit)="login()">

          <div class="mb-3">

            <label
              for="username"
              class="form-label"
            >
              Usuario
            </label>

            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              placeholder="Ingresa tu usuario"
              [(ngModel)]="loginRequest.username"
              required
            />

          </div>

          <div class="mb-4">

            <label
              for="password"
              class="form-label"
            >
              Contraseña
            </label>

            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Ingresa tu contraseña"
              [(ngModel)]="loginRequest.password"
              required
            />

          </div>

          <button
            type="submit"
            class="btn btn-primary w-100 login-button"
          >
            Ingresar
          </button>

        </form>

      </div>

    </div>

    <div class="col-12 col-md-4">
    </div>

  </div>

</div>
